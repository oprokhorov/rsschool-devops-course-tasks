apiVersion: 1

contactPoints:
  - orgId: 1
    name: DevOps contact point
    receivers:
      - uid: devops
        type: email
        settings:
          addresses: alerts@weyland-yutani.local
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: "DevOps contact point"
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: "DevOps contact point"
        matchers:
          - severity = high
        group_wait: 10s
        group_interval: 5m
        repeat_interval: 1h
      - receiver: "DevOps contact point"
        matchers:
          - severity = critical
        group_wait: 5s
        group_interval: 2m
        repeat_interval: 30m

groups:
  - orgId: 1
    name: 10s eval
    folder: dashboards
    interval: 10s
    rules:
      - uid: low-available-memory
        title: Low available cluster memory
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              adhocFilters: []
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum (container_memory_working_set_bytes{id="/",kubernetes_io_hostname=~"^.*$"}) / sum (machine_memory_bytes{kubernetes_io_hostname=~"^.*$"}) * 100
              instant: true
              interval: 10s
              intervalFactor: 1
              intervalMs: 15000
              maxDataPoints: 100
              range: false
              refId: A
              step: 10
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 60
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: 6169cb6b-ad44-4c0d-a186-7e1b8e1594a4
        panelId: 4
        noDataState: NoData
        execErrState: Error
        for: 1m
        keepFiringFor: 10s
        annotations:
          __dashboardUid__: 6169cb6b-ad44-4c0d-a186-7e1b8e1594a4
          __panelId__: "4"
        labels:
          severity: medium
        isPaused: false
        notification_settings:
          receiver: "DevOps contact point"
      - uid: high-cpu-usage
        title: High Cluster CPU usage (1m avg)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              adhocFilters: []
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum (rate (container_cpu_usage_seconds_total{id="/",kubernetes_io_hostname=~"^.*$"}[1m])) / sum (machine_cpu_cores{kubernetes_io_hostname=~"^.*$"}) * 100
              instant: true
              interval: 10s
              intervalFactor: 1
              intervalMs: 15000
              maxDataPoints: 100
              range: false
              refId: A
              step: 10
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 60
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: 6169cb6b-ad44-4c0d-a186-7e1b8e1594a4
        panelId: 6
        noDataState: NoData
        execErrState: Error
        for: 10s
        keepFiringFor: 10s
        annotations:
          __dashboardUid__: 6169cb6b-ad44-4c0d-a186-7e1b8e1594a4
          __panelId__: "6"
        labels:
          severity: high
        isPaused: false
        notification_settings:
          receiver: "DevOps contact point"
